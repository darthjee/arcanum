# CI for the core/ Node.js package. Reuses the same Docker-based
# `core-*` Makefile targets a contributor runs locally (see
# docs/agents/architecture/script-engine.md's "Docker test image"
# section) so CI behaves identically to local development.
#
# The `coverage` job's Codacy upload step requires a `CODACY_PROJECT_TOKEN`
# repo secret that does not exist yet as of this workflow's introduction —
# until the repo owner creates/connects the Codacy project and adds that
# secret, this step will fail even though the underlying test run passed.
# This is expected and not a sign of a broken workflow.
name: core CI

on:
  pull_request:
    paths:
      - "core/**"
  push:
    branches:
      - main
    paths:
      - "core/**"

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests with coverage
        run: make core-test

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: core/coverage/lcov.info

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: make core-lint

      - name: Duplication report
        run: make core-report
        continue-on-error: true

      - name: Dependency audit
        run: make core-audit
        continue-on-error: true

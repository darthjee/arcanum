# Excludes test-support helpers (fixtures/factories/utils) that build
# throwaway files under a trusted, test-controlled temp directory —
# Codacy's detect-non-literal-fs-filename (and similar) rules can't see
# that the directory is trusted and flag it as a false positive on every
# writeFile/mkdir/chmod call here. See issues #460 and #496.
#
# Excludes CLAUDE.md and .github/copilot-instructions.md, which the
# `init-claude` skill deliberately generates as thin 1-line redirects to
# AGENTS.md (the single source of truth) across every init-claude
# scenario. Agentlinter analyzes each file in isolation without
# following the redirect, so it flags these as incomplete standalone
# agent-instruction files (missing boundaries/tools/identity/sections/
# version) — false positives. See issue #498.
#
# Excludes core/yarn.lock, an autogenerated Yarn lockfile. Codacy's Lizard
# file-nloc complexity check flags it purely for line count, which is
# meaningless for a machine-generated dependency manifest. See issue #500.
#
# Excludes core/**/*.js from the PMD engine only — ESLint, Lizard,
# Opengrep, duplication and the other tools keep analysing every core/
# file. PMD's ecmascript parser misidentifies required JS syntax — try {
# openers, destructuring assignments, returned object literals, and
# switch-case blocks required by the already-enabled no-case-declarations
# ESLint rule — as "unnecessary blocks"
# (PMD_category_ecmascript_codestyle_UnnecessaryBlock). None of these can
# be removed without breaking the code or violating an existing lint
# rule, so every such finding is a false positive. A glob replaces the
# former per-file global list, which switched off every tool on those
# files and had to grow with each new core/ JS file. The engine key is
# `pmd`, the shortName in Codacy's API (api/v3/tools) of the PMD tool
# enabled for this repo and emitting the pattern (PMD7, `pmd-7`, is
# disabled). core/spec/support/** stays excluded globally for its own
# reason (see above; #510). See issues #509–#514 and #609.
#
# Excludes core/Dockerfile from the Opengrep (Semgrep-based) engine only —
# Hadolint and the other tools keep analysing it. Opengrep's
# missing-user / missing-user-entrypoint rules flag the file because it
# has no USER directive, which is intentional: the entrypoint must start
# as root to `chown` the mount points (the core_node_modules volume and,
# on Linux, the bind-mounted repo root), then drops to `node` via `su`
# before running CMD — see core/docker-entrypoint.sh. Inline `nosemgrep`
# suppression is not honoured by Codacy. The engine key is `opengrep`,
# the tool's shortName in Codacy's API (api/v3/tools) and the name listed
# in Codacy's configuration-file docs. See issues #494 and #604.
#
# Excludes the seven literal template files (.github/{pull_request_template,
# commit_message_template,commit_message_template-2.0}.md, their mirrors
# under init-claude/templates/, and auto-fix-all/templates/reply.tmpl.md)
# from the markdownlint engine only — the other tools keep analysing them.
# Their content is substituted verbatim into commit messages, PR bodies,
# and reply comments, so a `# Title` line added to satisfy MD041 would leak
# into that generated output. .markdownlintignore already lists them for
# local runs, but Codacy does not honor .markdownlintignore. The engine key
# is `markdownlint`, the tool's shortName in Codacy's API (api/v3/tools).
# Keep this list in sync with the template block in .markdownlintignore.
# See issues #502 and #622–#628.
engines:
  opengrep:
    exclude_paths:
      - "core/Dockerfile"
  pmd:
    exclude_paths:
      - "core/**/*.js"
  markdownlint:
    exclude_paths:
      - ".github/pull_request_template.md"
      - ".github/commit_message_template.md"
      - ".github/commit_message_template-2.0.md"
      - "init-claude/templates/pull_request_template.md"
      - "init-claude/templates/commit_message_template.md"
      - "init-claude/templates/commit_message_template-2.0.md"
      - "auto-fix-all/templates/reply.tmpl.md"
exclude_paths:
  - "core/spec/support/**"
  - "CLAUDE.md"
  - ".github/copilot-instructions.md"
  - "core/yarn.lock"

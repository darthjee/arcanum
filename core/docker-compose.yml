# Runs core/'s test suite (and lint) inside the darthjee/node-based test
# image, with core/ bind-mounted rather than baked in — see Dockerfile
# and docs/agents/architecture/script-engine.md. Invoked via the
# `core-*` Makefile targets at the repo root, not directly.
services:
  core:
    build:
      # The install root, so the same core/Dockerfile also builds the
      # `runtime` target (see the root .dockerignore).
      context: ..
      dockerfile: core/Dockerfile
      target: test
    volumes:
      - ../:/home/node/app
      - core_node_modules:/home/node/app/core/node_modules
    working_dir: /home/node/app/core
    command: sh -c "yarn install --frozen-lockfile && yarn test"

volumes:
  core_node_modules:

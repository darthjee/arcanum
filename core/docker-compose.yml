# Runs core/'s test suite (and lint) inside the darthjee/node-based test
# image, with core/ bind-mounted rather than baked in — see Dockerfile
# and docs/agents/architecture/script-engine.md. Invoked via the
# `core-*` Makefile targets at the repo root, not directly. The `cli`
# service reuses the same test image for cli/ (the `cli-*` targets); it
# mounts the whole repo because cli/'s build reads ../core and
# ../arcanum, and gives cli/node_modules its own volume since esbuild
# ships a platform-specific binary. The `shared` service does the same
# for shared/ (the `shared-*` targets): whole repo mounted, shared/ as
# working dir, shared/node_modules in its own volume.
services:
  core:
    build:
      # The install root, so the same core/Dockerfile also builds the
      # `runtime` target (see the root .dockerignore).
      context: ..
      dockerfile: core/Dockerfile
      target: test
    volumes:
      - ../:/home/node/app
      - core_node_modules:/home/node/app/core/node_modules
    working_dir: /home/node/app/core
    command: sh -c "yarn install --frozen-lockfile && yarn test"

  cli:
    build:
      context: ..
      dockerfile: core/Dockerfile
      target: test
    volumes:
      - ../:/home/node/app
      - cli_node_modules:/home/node/app/cli/node_modules
    working_dir: /home/node/app/cli
    command: sh -c "yarn install --frozen-lockfile && yarn build && yarn test"

  shared:
    build:
      context: ..
      dockerfile: core/Dockerfile
      target: test
    volumes:
      - ../:/home/node/app
      - shared_node_modules:/home/node/app/shared/node_modules
    working_dir: /home/node/app/shared
    command: sh -c "yarn install --frozen-lockfile && yarn test"

volumes:
  core_node_modules:
  cli_node_modules:
  shared_node_modules:

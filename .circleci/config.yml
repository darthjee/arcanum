# CircleCI pipeline for arcanum.
#
# Requires a CircleCI project (or context) env var named GH_TOKEN, holding
# a GitHub token with `repo` scope, so this job can create/update the
# GitHub Release and upload the release zip asset for the pushed tag.
#
# Triggered only on tag pushes matching the repo's semver tag convention
# (bare X.Y.Z, no "v" prefix — e.g. 0.9.10).
#
# Talks to the GitHub REST API directly via curl (see scripts/
# upload_release_asset.sh) rather than through the `gh` CLI. `gh` auto-
# authenticates from a GH_TOKEN/GITHUB_TOKEN env var, which made the old
# explicit `gh auth login --with-token` step both redundant and, once
# GH_TOKEN was actually set, a hard failure. Mechanism documented in
# release-zip.md.
#
# The `publish-image` job (also release-only, run after build-and-release)
# pushes the multi-arch (linux/amd64 + linux/arm64) runtime image
# darthjee/arcanum:<tag> to Docker Hub via scripts/publish_runtime_image.sh.
# It requires CircleCI project (or context) env vars DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN, a Docker Hub access token with push rights on the
# darthjee/arcanum repository. Only the version tag is pushed (no
# `latest`), and published tags are immutable: the job fails if
# darthjee/arcanum:<tag> already exists, including on workflow re-runs.
#
# The `publish-cli` job (also release-only, run after build-and-release, in
# parallel with publish-image) publishes the arcanum-cli@<tag> npm package
# via scripts/publish_cli_package.sh, with npm trusted publishing. npm
# does not read CircleCI's default CIRCLE_OIDC_TOKEN_V2 (its audience is
# the org ID), so the script mints an npm-audience token with
# `circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}'`
# and exports it as NPM_ID_TOKEN, which npm exchanges for a short-lived
# publish credential. npm generates no provenance for CircleCI publishes.
# No npm token env var is needed, and none is allowed (the script
# refuses NPM_TOKEN/NODE_AUTH_TOKEN). The image's bundled npm is too old
# for trusted publishing, so the job installs an exact npm 11.x pin first.
# Re-runs after a successful publish are no-ops (npm versions are
# immutable). The trusted publisher must be registered once by hand on
# npmjs.com; see docs/agents/architecture/install-and-release.md.
#
# The `mod-checks` job (test workflow) runs `claude plugin validate` and
# `claude plugin test` for the arcanum-next-step mod. Both work headless
# with no credential. `tsc -p` is left out: it extends the engine-generated
# .claude-plugin/types/ folder, which only a live session writes, so
# `make mod-check` (run locally) is the full gate for it.
#
# The `runtime-image` job (test workflow) runs `make core-smoke-runtime` on
# a machine executor, since the smoke's `--user`/`--read-only`/`--tmpfs`
# runs need a local Docker daemon (not setup_remote_docker). It builds only
# the native linux/amd64 `runtime` target of core/Dockerfile, with no push
# and no Docker Hub login, so image breakage (e.g. #850's stale apt pin)
# fails on the branch instead of in the release-only `publish-image` job.
# It has no path filters: upstream drift (Debian mirrors, the darthjee/node
# base image) can break the build with no repo change.
#
# The `cli` and `cli-node-floor` jobs (test workflow) gate the cli/
# package. Both check out the full repo and run from cli/, since its
# esbuild build bundles ../shared/lib and ../arcanum/migrations/repos (any
# change there can break the CLI, so neither job has path filters).
# `yarn test` does not build, so `yarn build` always runs first. `cli`
# runs on the same image as `test`/`checks` (lint, build, test, then a
# non-blocking audit); `cli-node-floor` re-runs build and test on
# cimg/node:22.13.0, the CLI's minimum supported Node (the darthjee image
# runs 22.14.0, so it is not the floor). No Codacy coverage upload yet.
#
# The `shared` and `shared-node-floor` jobs (test workflow) gate the
# shared/ package the same way, from shared/ in a full checkout (no path
# filters). shared/ has no build step. `shared` lints, runs the specs
# under c8 (coverage thresholds enforced, blocking), then a non-blocking
# audit; `shared-node-floor` re-runs the specs on cimg/node:22.13.0,
# since the CLI bundles shared/ and ships it to users on Node 22.13.
#
# Codacy coverage: `test` (core/) and `shared` (shared/) each upload a
# partial lcov report (`report --partial`), after rewriting its `SF:`
# paths from package-relative (`lib/...`) to repo-root (`core/lib/...`,
# `shared/lib/...`). The `coverage-final` job, which requires both, then
# sends Codacy's `final` call to merge them for the commit. All uploads
# are non-blocking. If `test` or `shared` fails, `coverage-final` is
# skipped and that commit's coverage is never finalized (accepted).

version: 2.1

jobs:
  build-and-release:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install zip and jq
          command: |
            sudo apt-get update
            sudo apt-get install -y zip jq
      - run:
          name: Check docs/agents/tag-mutations.md is up to date (non-blocking)
          command: scripts/check_tags_table.sh
      - run:
          name: Build release zip
          command: |
            ZIP_PATH=$(scripts/build_release_zip.sh)
            echo "export ZIP_PATH=${ZIP_PATH}" >> "$BASH_ENV"
      - run:
          name: Create or update GitHub release and upload asset
          command: scripts/upload_release_asset.sh "$CIRCLE_TAG" "$ZIP_PATH"

  publish-image:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Set up QEMU and a multi-platform buildx builder
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install arm64
            docker buildx create --name arcanum --use
            docker buildx inspect --bootstrap
      - run:
          name: Log in to Docker Hub
          command: |
            : "${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME env var is required}"
            : "${DOCKERHUB_TOKEN:?DOCKERHUB_TOKEN env var is required}"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build and push the multi-arch runtime image
          command: scripts/publish_runtime_image.sh "$CIRCLE_TAG"

  publish-cli:
    docker:
      - image: darthjee/circleci_node:0.2.1
    working_directory: ~/project/cli
    environment:
      NPM_PIN: 11.21.1
      NPM_MIN: 11.5.1
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Ensure npm supports trusted publishing
          command: |
            node --version
            npm --version
            if [ "$(printf '%s\n' "$NPM_MIN" "$(npm --version)" | sort -V | head -n 1)" != "$NPM_MIN" ]; then
              npm install -g "npm@${NPM_PIN}"
              npm --version
            fi
      - run:
          name: Publish arcanum-cli to npm
          command: ../scripts/publish_cli_package.sh "$CIRCLE_TAG"

  test:
    docker:
      - image: darthjee/circleci_node:0.2.1
    working_directory: ~/project/core
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Run tests with coverage
          command: yarn test
      - run:
          name: Make coverage paths relative to the repository root
          command: sed -i -E 's#^SF:(.*/core/)?lib/#SF:core/lib/#' coverage/lcov.info
      - run:
          name: Upload partial coverage to Codacy (non-blocking)
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) report --partial -r coverage/lcov.info || true

  checks:
    docker:
      - image: darthjee/circleci_node:0.2.1
    working_directory: ~/project/core
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Lint
          command: yarn lint
      - run:
          name: Duplication report (non-blocking)
          command: yarn duplication || true
      - run:
          name: Dependency audit (non-blocking)
          command: yarn audit || true
      - run:
          name: Commit-message template sync check (non-blocking)
          command: ../scripts/check_commit_template_sync.sh || true

  cli:
    docker:
      - image: darthjee/circleci_node:0.2.1
    working_directory: ~/project/cli
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Lint
          command: yarn lint
      - run:
          name: Build
          command: yarn build
      - run:
          name: Run tests
          command: yarn test
      - run:
          name: Dependency audit (non-blocking)
          command: yarn audit || true

  cli-node-floor:
    docker:
      - image: cimg/node:22.13.0
    working_directory: ~/project/cli
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Build
          command: yarn build
      - run:
          name: Run tests
          command: yarn test

  shared:
    docker:
      - image: darthjee/circleci_node:0.2.1
    working_directory: ~/project/shared
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Lint
          command: yarn lint
      - run:
          name: Run tests with coverage
          command: yarn test
      - run:
          name: Make coverage paths relative to the repository root
          command: sed -i -E 's#^SF:(.*/shared/)?lib/#SF:shared/lib/#' coverage/lcov.info
      - run:
          name: Upload partial coverage to Codacy (non-blocking)
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) report --partial -r coverage/lcov.info || true
      - run:
          name: Dependency audit (non-blocking)
          command: yarn audit || true

  shared-node-floor:
    docker:
      - image: cimg/node:22.13.0
    working_directory: ~/project/shared
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Run tests
          command: yarn test

  coverage-final:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - run:
          name: Finalize Codacy coverage (non-blocking)
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) final || true

  mod-checks:
    docker:
      - image: darthjee/circleci_node:0.2.1
    working_directory: ~/project
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install the Claude Code CLI
          command: npm i -g @anthropic-ai/claude-code@2.1.302
      - run:
          name: Validate the arcanum-next-step mod
          command: claude plugin validate arcanum-next-step
      - run:
          name: Test the arcanum-next-step mod
          command: claude plugin test arcanum-next-step

  runtime-image:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build and smoke-test the runtime image
          command: make core-smoke-runtime

workflows:
  release:
    jobs:
      - build-and-release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^\d+\.\d+\.\d+$/
      - publish-image:
          requires: [build-and-release]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^\d+\.\d+\.\d+$/
      - publish-cli:
          requires: [build-and-release]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^\d+\.\d+\.\d+$/

  test:
    jobs:
      - test:
          filters:
            tags:
              ignore: /.*/
      - checks:
          filters:
            tags:
              ignore: /.*/
      - mod-checks:
          filters:
            tags:
              ignore: /.*/
      - cli:
          filters:
            tags:
              ignore: /.*/
      - cli-node-floor:
          filters:
            tags:
              ignore: /.*/
      - shared:
          filters:
            tags:
              ignore: /.*/
      - shared-node-floor:
          filters:
            tags:
              ignore: /.*/
      - runtime-image:
          filters:
            tags:
              ignore: /.*/
      - coverage-final:
          requires: [test, shared]
          filters:
            tags:
              ignore: /.*/

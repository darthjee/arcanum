# CircleCI pipeline for arcanum.
#
# Requires a CircleCI project (or context) env var named GH_TOKEN, holding
# a GitHub token with `repo` scope, so this job can create/update the
# GitHub Release and upload the release zip asset for the pushed tag.
#
# Triggered only on tag pushes matching the repo's semver tag convention
# (bare X.Y.Z, no "v" prefix — e.g. 0.9.10).
#
# Talks to the GitHub REST API directly via curl (see scripts/
# upload_release_asset.sh) rather than through the `gh` CLI. `gh` auto-
# authenticates from a GH_TOKEN/GITHUB_TOKEN env var, which made the old
# explicit `gh auth login --with-token` step both redundant and, once
# GH_TOKEN was actually set, a hard failure. Mechanism documented in
# release-zip.md.

version: 2.1

jobs:
  build-and-release:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install zip and jq
          command: |
            sudo apt-get update
            sudo apt-get install -y zip jq
      - run:
          name: Build release zip
          command: |
            ZIP_PATH=$(scripts/build_release_zip.sh)
            echo "export ZIP_PATH=${ZIP_PATH}" >> "$BASH_ENV"
      - run:
          name: Create or update GitHub release and upload asset
          command: scripts/upload_release_asset.sh "$CIRCLE_TAG" "$ZIP_PATH"

workflows:
  release:
    jobs:
      - build-and-release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^\d+\.\d+\.\d+$/
